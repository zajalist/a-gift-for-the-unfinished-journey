; Saskarta scalability presets (Task P4).
; See Tools/Perf/PRESETS.md for the reasoning behind every non-default line and
; for what is still provisional pending the P5 flythrough numbers.
;
; This file only OVERRIDES keys on top of the engine's own
; Engine/Config/BaseScalability.ini (verified against UE 5.8.2 at
; C:/Program Files/Epic Games/UE_5.8) - it does not restate the whole table.
; A level not mentioned for a given group inherits the engine default.
;
; Levels: 0 Low, 1 Medium, 2 High, 3 Epic, 4 Cinematic.
; High (2) is the 80 fps @ 1440p TSR-Quality target on an RTX 5070 - see the
; GPU budget table in task-P4-brief.md. All values here are PROVISIONAL until
; a real P5 flythrough measures them.
;
; NOT overridden here (left at engine BaseScalability.ini defaults - no
; project-specific need was identified): AntiAliasingQuality, ReflectionQuality,
; PostProcessQuality, TextureQuality, ShadingQuality. Note "Landscape" in the
; P4 brief's interface list is not a real UE 5.8 scalability group (verified:
; UGameUserSettings/Scalability.cpp expose ViewDistance, AntiAliasing, Shadow,
; GlobalIllumination, Reflection, PostProcessing, Texture, Effects (Visual
; Effect), Foliage and Shading - ten groups, no Landscape). AntiAliasing was
; almost certainly what was meant; it is left at engine defaults since the
; project relies on the Upscaler menu (TSR/DLSS) rather than a separate AA
; quality tier.
;
; Task PERF-AUTO audit (2026-09-27, Tools/Perf/SCALABILITY.md):
; - Cinematic sections are named @Cine, not @4: Scalability.cpp looks up
;   "<Group>@Cine" for the top level, so the old @4 sections never applied and
;   Cinematic ran the ENGINE values (r.ViewDistanceScale=10, fog grid 4 px).
; - Some CVars here are held above the scalability priority by the project
;   (RendererSettings / DefaultEngine.ini [SystemSettings]) and are silently
;   ignored when set from this file: r.Shadow.Virtual.ResolutionLodBiasDirectional,
;   r.Nanite.MaxPixelsPerEdge, r.Streaming.PoolSize, r.Lumen.TraceMeshSDFs,
;   r.Lumen.HardwareRayTracing, r.Lumen.Reflections.MaxRoughnessToTraceForFoliage.
;   USaskartaGameUserSettings::ComputeTierCVars sets the first four (and HWRT)
;   per tier at the [SystemSettings] priority instead; the lines below that
;   remain are kept equal to that table.
; - A key set in one level of a group must be set in every level of it, or it
;   sticks when the player switches back.

; ---------------------------------------------------------------------------
; ViewDistanceQuality: only r.ViewDistanceScale. This affects prop/foliage LOD
; and cull distance scaling; it does NOT affect World Partition streaming
; distance or the landscape/mountain silhouette (that is a WP runtime-cell
; setting, out of scope for P4).
[ViewDistanceQuality@0]
r.StaticMeshLODDistanceScale=1.5
r.ViewDistanceScale=0.5

[ViewDistanceQuality@1]
r.StaticMeshLODDistanceScale=1.25
r.ViewDistanceScale=0.75

[ViewDistanceQuality@2]
r.StaticMeshLODDistanceScale=1.0
r.ViewDistanceScale=1.0

[ViewDistanceQuality@3]
r.StaticMeshLODDistanceScale=1.0
r.ViewDistanceScale=1.25

[ViewDistanceQuality@Cine]
r.StaticMeshLODDistanceScale=1.0
r.ViewDistanceScale=1.5

; ---------------------------------------------------------------------------
; ShadowQuality: VSM page budget and directional resolution bias. See
; docs/performance-budget.md - the SystemSettings baseline is
; ResolutionLodBiasDirectional=0.0; these override it per preset once a level
; is picked (Scalability reapplies after the SystemSettings ini load).
[ShadowQuality@0]
; The LOD bias lines are masked by [SystemSettings]; ComputeTierCVars applies the same values.
r.Shadow.Virtual.ResolutionLodBiasDirectional=2.0
r.Shadow.Virtual.MaxPhysicalPages=512
; Engine BaseScalability already turns volumetric fog off at Low and Medium; stated for clarity.
r.VolumetricFog=0

[ShadowQuality@1]
r.Shadow.Virtual.ResolutionLodBiasDirectional=1.0
r.Shadow.Virtual.MaxPhysicalPages=1024

[ShadowQuality@2]
; 0.0 = what High actually ran (the 0.5 here was masked by [SystemSettings]); the PERF2 lane may raise it.
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.0
r.Shadow.Virtual.MaxPhysicalPages=2048

[ShadowQuality@3]
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.0
r.Shadow.Virtual.MaxPhysicalPages=3072
; The engine's Shadow@3 fog grid (8 px x 128) would override EffectsQuality@3 whenever only the
; shadow level changes (the governor steps shadows alone); match EffectsQuality's 16 x 64.
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64

[ShadowQuality@Cine]
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
r.Shadow.Virtual.MaxPhysicalPages=4096
; Engine Cine is 4 px x 128 with 16x history supersampling: a large RT for a screenshot tier.
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64
r.VolumetricFog.HistoryMissSupersampleCount=4

; ---------------------------------------------------------------------------
; GlobalIlluminationQuality: Lumen. Diffuse indirect is off entirely on Low
; (falls back to DFAO/skylight per engine default for that group) - this is a
; real, independent cvar with no Saskarta mirror, so it is safe to set here
; without being clobbered by ApplySaskartaSettings().
[GlobalIlluminationQuality@0]
; No Lumen GI: skylight only (engine: DFAO off, skylight x0.8). Screen-space GI would need
; r.DynamicGlobalIlluminationMethod=2, which post-process volumes override - not used.
r.Lumen.DiffuseIndirect.Allow=0
; PERF-AAA: set in every level of the group (Lumen reflections still trace at Low).
r.Lumen.TraceMeshSDFs=0

[GlobalIlluminationQuality@1]
; Software Lumen (global distance field only). PERF-AAA: hardware RT is off project-wide and the
; project no longer pins r.Lumen.TraceMeshSDFs, so this group owns it: 0 here, 1 (mesh SDF detail
; tracing) at High and above.
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.TraceMeshSDFs=0
r.Lumen.ScreenProbeGather.DownsampleFactor=64
r.Lumen.Reflections.MaxRoughnessToTraceForFoliage=0.1

[GlobalIlluminationQuality@2]
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.TraceMeshSDFs=1
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.Reflections.MaxRoughnessToTraceForFoliage=0

[GlobalIlluminationQuality@3]
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.TraceMeshSDFs=1
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.Reflections.MaxRoughnessToTraceForFoliage=0

[GlobalIlluminationQuality@Cine]
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.TraceMeshSDFs=1
r.Lumen.ScreenProbeGather.DownsampleFactor=8
r.Lumen.Reflections.MaxRoughnessToTraceForFoliage=0

; ---------------------------------------------------------------------------
; EffectsQuality: volumetric fog grid density and cloud ray sample counts.
; Deliberately NOT setting r.VolumetricCloud here: USaskartaGameUserSettings
; ::ApplySaskartaSettings() runs immediately after Super::ApplySettings() and
; writes r.VolumetricCloud from CloudMode every time, so a value set by this
; scalability group would be silently overwritten on the very same call. The
; per-preset cloud on/off (Low/Medium off, High+ on) is therefore driven by
; PresetFoliage[5].CloudMode in SaskartaGameUserSettings.cpp, not by ini. See
; Tools/Perf/PRESETS.md.
[EffectsQuality@0]
r.VolumetricFog.GridPixelSize=32
; Only used if the player turns volumetric clouds on at Low (the preset uses the 2D layer).
r.VolumetricCloud.ViewRaySampleMaxCount=128
r.VolumetricCloud.ReflectionRaySampleMaxCount=8

[EffectsQuality@1]
r.VolumetricFog.GridPixelSize=24
r.VolumetricCloud.ViewRaySampleMaxCount=192
r.VolumetricCloud.ReflectionRaySampleMaxCount=12

[EffectsQuality@2]
r.VolumetricFog.GridPixelSize=16
r.VolumetricCloud.ViewRaySampleMaxCount=384
r.VolumetricCloud.ReflectionRaySampleMaxCount=24

[EffectsQuality@3]
; STORM: the animated dust volume reaches 1.5 km; 16 px x 64 slices keeps it inside the 1.5 ms storm budget (was 12)
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64
r.VolumetricCloud.ViewRaySampleMaxCount=512
r.VolumetricCloud.ReflectionRaySampleMaxCount=32

[EffectsQuality@Cine]
; STORM: 16 px as at Epic (was 8)
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64
r.VolumetricCloud.ViewRaySampleMaxCount=768
r.VolumetricCloud.ReflectionRaySampleMaxCount=48

; ---------------------------------------------------------------------------
; FoliageQuality: the engine-native group (foliage.DensityScale /
; grass.DensityScale), read at generation time by the project's PCG spawners
; too. This is the PRE-restart baseline: before the user restarts the editor
; for GameUserSettingsClassName to take effect (R43), GetGameUserSettings()
; returns a plain UGameUserSettings with no override, so THIS ini group is
; what actually applies. After the restart, USaskartaGameUserSettings::
; ApplySettings()'s PresetFoliage[5] table sets S->FoliageDensity and
; ApplySaskartaSettings() mirrors it onto the same two cvars, superseding
; this table. Keep both in sync by hand until they can be generated from one
; source (see PRESETS.md).
[FoliageQuality@0]
grass.CullDistanceScale=0.6
foliage.DensityScale=0.35
grass.DensityScale=0.35

[FoliageQuality@1]
grass.CullDistanceScale=0.75
foliage.DensityScale=0.6
grass.DensityScale=0.6

[FoliageQuality@2]
grass.CullDistanceScale=1.0
foliage.DensityScale=0.9
grass.DensityScale=0.9

[FoliageQuality@3]
grass.CullDistanceScale=1.15
foliage.DensityScale=1.0
grass.DensityScale=1.0

[FoliageQuality@Cine]
grass.CullDistanceScale=1.5
foliage.DensityScale=1.0
grass.DensityScale=1.0
