; ---- Packaging (task PACKAGING, 2026-09-27) --------------------------------
; See .superpowers/sdd/2026-09-26-saskarta-world-sprint/task-PACKAGING-report.md.
; Saskarta_WP holds the whole flow (intro card -> loading -> title -> boot -> road),
; so it is the only map to cook. Without MapsToCook the cooker cooks EVERY map in
; Content (the pack demo maps included).
; The Directories to always cook are the assets the C++ loads by path or finds by
; name through the asset registry (event runner VO_* / VO_Carrier_*, the station's
; SONG_* and host takes, the storm SFX, DA_Saskarta_Story, DA_Station,
; DA_Saskarta_LookKeys, MPC_Saskarta_Sky, the game-flow UI and LS_CIN_* sequences).
; Never cook: editor tooling content (Hayba captures, Hayba automation, Python
; scripts, per-user Developers folder). Nothing in Saskarta_WP references them.
