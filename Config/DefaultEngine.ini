[/Script/Engine.VirtualTexturePoolConfig]
; Task PERF-URGENT: a fixed pool for the only pool that auto-grew in PIE (the 2-layer BC1/BC3 1024-tile
; runtime virtual texture: transient 124 MB after three PIE runs). Without it the editor auto-grows the pool
; mid-play ("Recreating virtual texture pools for formats"), and every growth re-inits every virtual texture
; and RVT component; packaged builds (no auto-grow) would stay at the 64 MB default and blur.
; Task PERF-AAA (2026-09-28): no pool auto-grow in the editor either. Auto-grow recreated every VT and RVT component
; mid-PIE ("Recreating virtual texture pools for formats", 4x in the user's 14:18 session, each a multi-second D3D12
; stall); a cooked build never grows, so PIE now behaves like the game. Every pool the standalone run creates has a
; fixed size. Consumer baseline (2026-10-05): landscape RVT 160 MB and four streaming-VT pools
; at 48 MB each (352 MB total). Residency mip bias trades distant detail for a bounded pool.
bPoolAutoGrowInEditor=False
; Consumer pools keep residency mip bias enabled to degrade gracefully.
+Pools=(Formats=(PF_DXT1,PF_DXT5),MinTileSize=1032,MaxTileSize=1032,SizeInMegabyte=160,bEnableResidencyMipMapBias=True,bAllowSizeScale=False)
