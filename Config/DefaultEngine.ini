[SystemSettings]
r.Skinning.DefaultAnimationMinScreenSize=0.2
r.TextureStreaming=1

; ==== Saskarta consumer baseline (1080p / 4 GB VRAM / 16 GB RAM) =========
; Verified against UE 5.8.2 source at C:/Program Files/Epic Games/UE_5.8.
; See docs/performance-budget.md for the reasoning behind each line.

; ---- host RAM -----------------------------------------------------------
; PCG's editor cache defaults to a 6 GB budget. That was the single largest
; slice of the editor's ~12 GB resident set on this map.
pcg.Cache.Editor.MemoryBudgetMB=512
; PCG may spend 15 ms/frame by default, which caps the editor near 60 fps on
; its own and is a major source of the lag spikes while regions stream in.
pcg.EditorFrameTime=8
pcg.RuntimeGeneration.NumGeneratingComponents=4
; PCG was rescheduling runtime generation EVERY tick (default 0). Exclusive/
; GameThread/Tickables was the source of the 122-149 ms frame spikes.
pcg.RuntimeGeneration.TimeBetweenRuntimeGenSchedulerTicks=0.1
pcg.FrameTime=3
pcg.Async.OutOfTickBudgetInMilliseconds=2

; PIE uses the editor VT upload budgets, not the game's budgets. Keep terrain
; page production bounded here too: the default 32 uploads / 8 continuous
; updates produced more long frames in the 2026-09-30 repeat A/B capture.
; This changes update throughput, not texture resolution or pool size.
r.VT.MaxUploadsPerFrameInEditor=2
r.VT.MaxContinuousUpdatesPerFrameInEditor=1

; UE 5.8 / RTX 5070 trace: graphics and compute queues stalled together for
; 0.6 s despite short shader passes. Serial scheduling plus the VT budget
; above restored 16.7 ms median frames without changing rendering quality.
; Evidence and remaining outliers: docs/performance/2026-09-30-live-profile.md.
r.RDG.AsyncCompute=0

; ---- texture streaming --------------------------------------------------
; Conservative startup budget; native hardware detection can raise it on
; larger GPUs. Asset texture caps reduce demand rather than hiding warnings.
r.Streaming.PoolSize=1200
r.Streaming.LimitPoolSizeToVRAM=1
; UsableVRAM = max(TotalVRAM x 70%, TotalVRAM - Clamp). Raising the clamp
; LOWERS assumed usable VRAM - it does not reserve 4 GB. Conservative on
; purpose. ECVF_Cheat, so it has no effect in Shipping.
; r.Streaming.PoolSize.VRAMPercentageClamp=4096  ; disabled 2026-09-27: ECVF_Cheat CVars are refused in DefaultEngine.ini (ensure + crash report on every launch)
r.Streaming.MaxEffectiveScreenSize=1080
r.Streaming.HiddenPrimitiveScale=0.25

; ---- Nanite -------------------------------------------------------------
; Nanite also needs root pages outside this pool. Leave space for the
; texture pool, shadows and render targets on a 4 GB card. Startup only.
r.Nanite.Streaming.StreamingPoolSize=384
r.Nanite.MaxPixelsPerEdge=1.5

; ---- GPU skin cache -----------------------------------------------------
; Recomputing tangents for every instanced skinned tree and reed each frame
; is what hung the GPU in GPUSkinCache_UpdateSkinningBatches on 2026-09-22.
; Foliage bends rigidly, so recomputed tangents buy nothing here.
r.SkinCache.RecomputeTangents=0

; ---- landscape editor memory ----------------------------------------------
; Drops editor-only landscape layer mip data on load. Hundreds of MB on a
; 256-proxy map; takes effect on the next level load. No runtime visual cost.
landscape.StripLayerMipsOnLoad=true

; ---- virtual shadow maps ------------------------------------------------
; Editor scalability ships these at -1.5 (Cinematic), i.e. HIGHER resolution
; sun shadows than default. 0.0 is the plain default and a large GPU win.
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=0.0
; Engine's own comment calls disabling this "a significant performance win";
; the cost is distant non-Nanite grass losing coarse-page shadows.
r.Shadow.Virtual.NonNanite.IncludeInCoarsePages=0
; NOT set to 0: VirtualShadowMapCacheManager.cpp:1288 gates on
; HasDeformableMesh() for EVERY proxy, so 0 would freeze the shadows of the
; player character and any animated NPC, not just foliage. The targeted fix
; is per-component ShadowCacheInvalidationBehavior=Rigid on foliage.
r.Shadow.Virtual.Cache.DeformableMeshesInvalidate=1

; ---- Lumen / ray tracing ------------------------------------------------
r.Lumen.Reflections.MaxRoughnessToTraceForFoliage=0
; 300 m of instanced foliage and debris in the BVH is VRAM and build cost
; for GI nobody can see. Epic's documented default is 15000.
r.RayTracing.Culling.Radius=12000
r.RayTracing.Geometry.InstancedStaticMeshes.CullClusterRadius=6000

; NOTE: foliage.MaxEndCullDistance is deliberately NOT set. It only applies
; in FHierarchicalStaticMeshSceneProxy's dynamic-mesh path
; (HierarchicalInstancedStaticMesh.cpp:1658/1870) - it does nothing for the
; plain ISM + Nanite components PCG spawns here. Real per-asset
; InstanceEndCullDistance values on the spawner descriptors are the fix.
; =========================================================================

