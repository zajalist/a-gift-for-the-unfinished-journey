[SystemSettings]
; Task PERF-URGENT. The VSM page pool as a reserved (tiled) resource: at PIE start its CommitReservedResource
; took 4.7-6.1 s inside the NVIDIA D3D12 driver (traced 3x); off, the call is gone and the PIE-start stalls
; halved (runs A/B, Tools/Perf/BUDGET.md). Cost: the pool is one committed allocation (fragmentation risk only).
r.Shadow.Virtual.AllocatePagePoolAsReservedResource=0
; Landscape grass components hold at most 16k instances (engine default 65,536). grass.MaxCreatePerFrame=1
; creates one component per frame, so the largest single-frame grass arrival drops 4x, and CullSubsections
; drops the far subsections of a landscape component instead of building them.
grass.MaxInstancesPerComponent=16384

